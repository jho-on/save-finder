
name: Web

on:
  push:
    branches: [develop, main]
    paths:
      - apps/frontend/web/**
      - Makefile
      - .github/workflows/web.yml
  pull_request:
    branches: [develop, main]
    paths:
      - apps/frontend/web/**
      - Makefile
      - .github/workflows/web.yml

permissions:
  contents: read
  deployments: write

concurrency:
  group: web-${{ github.ref }}
  cancel-in-progress: true

defaults:
  run:
    working-directory: apps/frontend/web

jobs:
  test:
    name: generate, test, build
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-go@v5
        with:
          go-version-file: apps/frontend/web/go.mod
          cache-dependency-path: apps/frontend/web/go.sum

      - name: templ generate
        run: go run github.com/a-h/templ/cmd/templ generate

      - name: generated code is in sync
        run: |
          if ! git diff --exit-code -- templates; then
            echo "::error::templates/*_templ.go are out of sync with .templ files. Run 'make generate' and commit the result."
            exit 1
          fi

      - name: gofmt
        run: |
          unformatted=$(gofmt -l .)
          if [ -n "$unformatted" ]; then
            echo "Files not gofmt-formatted:"
            echo "$unformatted"
            exit 1
          fi

      - name: go vet
        run: go vet ./...

      - name: test
        run: go test ./...

      - name: build
        run: go build -o /dev/null ./cmd/web

  deploy:
    name: Deploy Web
    needs: test
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    environment: production

    steps:
      - uses: actions/checkout@v4

      - name: Create GitHub Deployment
        id: deployment
        uses: actions/github-script@v7
        with:
          script: |
            const deployment = await github.rest.repos.createDeployment({
              owner: context.repo.owner,
              repo: context.repo.repo,
              ref: context.sha,
              environment: "production",
              auto_merge: false,
              required_contexts: [],
              production_environment: true,
              transient_environment: false,
              task: "deploy",
              description: "Deploy da Web"
            });

            core.setOutput("id", deployment.data.id);

            await github.rest.repos.createDeploymentStatus({
              owner: context.repo.owner,
              repo: context.repo.repo,
              deployment_id: deployment.data.id,
              state: "in_progress",
              description: "Implantando Web"
            });

      - name: Setup Go
        uses: actions/setup-go@v5
        with:
          go-version-file: apps/frontend/web/go.mod
          cache-dependency-path: apps/frontend/web/go.sum

      - name: Build Linux AMD64
        working-directory: apps/frontend/web
        env:
          GOOS: linux
          GOARCH: amd64
          CGO_ENABLED: 0
        run: go build -trimpath -ldflags="-s -w" -o save-finder-web ./cmd/web

      - name: Configure SSH
        uses: webfactory/ssh-agent@v0.9.0
        with:
          ssh-private-key: ${{ secrets.VPS_SSH_PRIVATE_KEY }}

      - name: Configure known hosts
        env:
          VPS_KNOWN_HOSTS: ${{ secrets.VPS_KNOWN_HOSTS }}
        run: |
          mkdir -p ~/.ssh
          printf '%s\n' "$VPS_KNOWN_HOSTS" > ~/.ssh/known_hosts
          chmod 700 ~/.ssh
          chmod 600 ~/.ssh/known_hosts

      - name: Upload binary
        env:
          VPS_HOST: ${{ secrets.VPS_HOST }}
          VPS_USER: ${{ secrets.VPS_USER }}
        run: |
          scp -o StrictHostKeyChecking=yes \
            apps/frontend/web/save-finder-web \
            "$VPS_USER@$VPS_HOST:/opt/save-finder/web/save-finder-web.new"

      - name: Restart Web and check health
        env:
          VPS_HOST: ${{ secrets.VPS_HOST }}
          VPS_USER: ${{ secrets.VPS_USER }}
        run: |
          ssh -o StrictHostKeyChecking=yes "$VPS_USER@$VPS_HOST" '
            set -eu

            mv /opt/save-finder/web/save-finder-web.new \
               /opt/save-finder/web/save-finder-web

            chmod 755 /opt/save-finder/web/save-finder-web

            sudo systemctl restart save-finder-web

            for attempt in $(seq 1 30); do
              if curl -fsS http://127.0.0.1:3000/ >/dev/null; then
                echo "Web healthy"
                exit 0
              fi
              sleep 2
            done

            sudo journalctl -u save-finder-web -n 50 --no-pager
            exit 1
          '

      - name: Update Deployment status
        if: always() && steps.deployment.outputs.id != ''
        uses: actions/github-script@v7
        env:
          DEPLOYMENT_ID: ${{ steps.deployment.outputs.id }}
          RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
        with:
          script: |
            await github.rest.repos.createDeploymentStatus({
              owner: context.repo.owner,
              repo: context.repo.repo,
              deployment_id: Number(process.env.DEPLOYMENT_ID),
              state: "${{ job.status }}" === "success" ? "success" : "failure",
              description: "${{ job.status }}" === "success"
                ? "Web implantada com sucesso"
                : "Falha na implantação da Web",
              log_url: process.env.RUN_URL
            });
