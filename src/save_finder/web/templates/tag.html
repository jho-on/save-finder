<!doctype html>
<html lang="pt-BR" data-theme="light">
	<head>
		<script>
			(function () {
				const s = localStorage.getItem("savefinder-theme");
				if (s) document.documentElement.setAttribute("data-theme", s);
			})();
		</script>
		<meta charset="utf-8" />
		<meta name="viewport" content="width=device-width, initial-scale=1" />
		<title>Tag — {{ app_name }}</title>
		<link rel="stylesheet" href="/static/style.css" />
		<style>
			:root,
			[data-theme="light"] {
				--bg: #ffffff;
				--fg: #000000;
				--accent: #fee761;
				--error: #ff0044;
				--surface: #ffffff;
				--border: #000000;
			}
			[data-theme="dark"] {
				--bg: #000000;
				--fg: #ffffff;
				--accent: #fee761;
				--error: #ff0044;
				--surface: #000000;
				--border: #ffffff;
			}
			body {
				background: var(--bg);
				color: var(--fg);
				font-family: system-ui, sans-serif;
				margin: 0;
			}
			.shell {
				max-width: 1200px;
				margin: 0 auto;
				padding: 2rem 1rem;
			}
			.card {
				background: var(--surface);
				border: 2px solid var(--border);
				border-radius: 8px;
				padding: 1rem;
			}
			.grid {
				display: grid;
				grid-template-columns: repeat(3, 1fr);
				gap: 1rem;
			}
			@media (max-width: 900px) {
				.grid {
					grid-template-columns: repeat(2, 1fr);
				}
			}
			@media (max-width: 600px) {
				.grid {
					grid-template-columns: 1fr;
				}
			}
		</style>
	</head>
	<body>
		{% include 'nav.html' %}
		<main class="shell">
			<header class="intro">
				<p class="eyebrow">
					<a href="/library" style="color: var(--accent)"
						>← Biblioteca</a
					>
					· <a href="/tags" style="color: var(--accent)">Tags</a>
				</p>
				<h1>Tag: {{ tag_name }}</h1>
				<p class="lede" style="color: var(--fg); opacity: 0.85">
					{{ tag_slug }} — {{ count }} itens
				</p>
			</header>

			<section class="library">
				<div id="items">
					<p>Carregando...</p>
				</div>
				{% include "pagination.html" %}
			</section>
		</main>

		<script>
			(function () {
				const s = localStorage.getItem("savefinder-theme");
				if (s) document.documentElement.setAttribute("data-theme", s);
			})();

			function toggleTheme() {
				const html = document.documentElement;
				const n =
					html.getAttribute("data-theme") === "dark"
						? "light"
						: "dark";

				html.setAttribute("data-theme", n);
				localStorage.setItem("savefinder-theme", n);
			}

			let currentOffset = 0;
			const limit = 20;
			let totalPages = 1;
			const slug = "{{ tag_slug }}";

			function hxt(url) {
				fetch(url)
					.then((r) => r.json())
					.then((d) => {
						const c = document.getElementById("items");

						if (!d.items || !d.items.length) {
							c.innerHTML = "<p>Nenhum resultado.</p>";

							document.getElementById("page-info").textContent =
								"—";
							document.getElementById("prev-button").disabled =
								true;
							document.getElementById("next-button").disabled =
								true;

							currentOffset = 0;
							totalPages = 1;
							return;
						}

						currentOffset = d.offset || 0;

						const total = d.total || 0;
						const page = Math.floor(currentOffset / limit) + 1;

						totalPages = Math.ceil(total / limit) || 1;

						document.getElementById("page-info").textContent =
							"Página " +
							page +
							" de " +
							totalPages +
							" (" +
							total +
							" itens)";

						document.getElementById("prev-button").disabled =
							page <= 1;
						document.getElementById("next-button").disabled =
							page >= totalPages;

						c.innerHTML =
							'<div class="grid">' +
							d.items
								.map((i) => {
									const thumb = i.thumb_path
										? "/data/" + i.thumb_path
										: "";

									const tags =
										(i.tags || [])
											.map((t) => t.slug)
											.join(", ") || "-";

									return (
										'<a href="/item/' +
										i.id +
										'" style="text-decoration:none;color:inherit;"><article class="card" style="cursor:pointer;">' +
										(thumb
											? '<img src="' +
												thumb +
												'" alt="" loading="lazy" style="max-width:100%;border-radius:4px;border:2px solid var(--border);"/>'
											: "") +
										'<h3 style="color:var(--fg);margin:.25rem 0;">' +
										(i.title || i.external_id || "") +
										"</h3>" +
										'<p style="margin:.25rem 0;color:var(--fg);font-size:.85rem;overflow:hidden;text-overflow:ellipsis;display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical;">' +
										(i.author || "") +
										"</p>" +
										'<p style="margin:.25rem 0;color:var(--fg);font-size:.85rem;"><strong>Tipo:</strong> ' +
										(i.post_type || "-") +
										" | <strong>Peças:</strong> " +
										(i.media_count || 0) +
										"</p>" +
										'<p style="margin:.25rem 0;color:var(--fg);font-size:.85rem;"><strong>Tags:</strong> ' +
										tags +
										' | <strong>Status:</strong> <span style="color:' +
										(i.status === "error"
											? "var(--error)"
											: i.status === "enriched"
												? "var(--accent)"
												: "var(--fg)") +
										'">' +
										(i.status || "-") +
										"</span></p>" +
										"</article></a>"
									);
								})
								.join("") +
							"</div>";
					})
					.catch(() => {
						document.getElementById("items").innerHTML =
							'<p style="color:var(--fg)">Erro ao carregar biblioteca.</p>';
					});
			}

			function prevPage() {
				if (currentOffset >= limit) {
					hxt(
						"/api/items?limit=" +
							limit +
							"&offset=" +
							(currentOffset - limit) +
							"&tag=" +
							encodeURIComponent(slug),
					);
				}
			}

			function nextPage() {
				if (currentOffset + limit < totalPages * limit) {
					hxt(
						"/api/items?limit=" +
							limit +
							"&offset=" +
							(currentOffset + limit) +
							"&tag=" +
							encodeURIComponent(slug),
					);
				}
			}

			hxt(
				"/api/items?limit=" +
					limit +
					"&offset=0&tag=" +
					encodeURIComponent(slug),
			);
		</script>
	</body>
</html>
