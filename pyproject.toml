[build-system]
requires = ["setuptools>=69"]
build-backend = "setuptools.build_meta"

[project]
name = "save-finder"
version = "0.1.0"
description = "Local library and classifier for media saved on social networks"
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
    "alembic>=1.13",
    "fastapi>=0.111",
    "jinja2>=3.1",
    "pyyaml>=6.0",
    "python-multipart>=0.0.9",
    "rich>=13.0",
    "sqlalchemy>=2.0",
    "typer>=0.12",
    "uvicorn[standard]>=0.30",
    "yt-dlp>=2024.8.6",
]

[project.optional-dependencies]
dev = [
    "httpx>=0.27",
    "pytest>=8.0",
    "ruff>=0.6",
]
asr = [
    "faster-whisper>=1.0",
]
vision = [
    "open-clip-torch>=2.26",
    "pillow>=10.0",
    "torch>=2.3",
]
llm = [
    "ollama>=0.3",
]

[project.scripts]
save-finder = "save_finder.cli:app"

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
save_finder = ["py.typed", "web/templates/*.html", "web/static/*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"
markers = [
    "network: tests that access the network (not run by default)",
    "model: tests that load local ML models (not run by default)",
]

[tool.ruff]
line-length = 100
target-version = "py311"
src = ["src", "tests"]

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM", "RUF"]

[tool.ruff.lint.per-file-ignores]
"migrations/versions/*.py" = ["E501"]
